[package]
name = "xtask"
description = "Maintainer tasks for the one-saves workspace"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = { workspace = true }

[lints]
workspace = true

# Installs the hooks in `.cargo-husky/hooks/` into `.git/hooks` whenever this crate's tests are
# built, which `just test` does. They keep the committed registry tables in step with the JSON:
# a drift that reaches a release publishes tables that are not what the data says. `just hooks`
# installs them without running the suite.
[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
