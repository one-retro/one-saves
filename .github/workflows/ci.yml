name: CI

# Every job runs a justfile recipe rather than its own copy of the commands, so `just check`
# locally and a green run here are the same thing by construction. Add a step here only when it
# is a new recipe; change what a step *does* in the justfile.

on:
  push:
    branches: [main]
  pull_request:

# Every job reads the repository and nothing else: nothing here publishes, comments or pushes, so
# a step that misbehaves has no token worth stealing.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@859dfda2225e25c12478e3c7796d19fd3735881f # just
        with:
          tool: just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The conformance corpus is the point of the suite, so it runs everywhere rather than on one
      # platform: an endianness or path assumption that only bites on Windows should fail here.
      - run: just test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: taiki-e/install-action@859dfda2225e25c12478e3c7796d19fd3735881f # just
        with:
          tool: just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: just fmt-check
      - run: just lint
      - run: just doc

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Stable, deliberately: the recipe installs and selects the old toolchain from the `msrv`
      # variable in the justfile, so the version this checks is stated in one place rather than
      # here as well.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@859dfda2225e25c12478e3c7796d19fd3735881f # just
        with:
          tool: just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: just msrv

  features:
    name: the crates with their features turned down
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: taiki-e/install-action@859dfda2225e25c12478e3c7796d19fd3735881f # just
        with:
          tool: just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: just test-features

  registries-in-sync:
    name: registry tables match their data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: taiki-e/install-action@859dfda2225e25c12478e3c7796d19fd3735881f # just
        with:
          tool: just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The generated tables are committed, so a hand edit to either half shows up as a diff here
      # rather than as a silent divergence from the JSON. This needs nothing fetched: without
      # --docs the recipe rebuilds the tables from the JSON already in the repository.
      - run: just registries-in-sync

  audit:
    name: no dependency with a known vulnerability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@859dfda2225e25c12478e3c7796d19fd3735881f # just
        with:
          tool: just,cargo-audit
      # Against the lockfile, so it needs no toolchain beyond the one the runner ships with. An
      # advisory published after a dependency was locked fails the next run, not the next bump.
      - run: just audit
