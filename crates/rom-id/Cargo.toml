[package]
name = "rom-id"
description = "Identify a cartridge ROM dump: its system, its header, and the hardware on its cartridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories = ["parser-implementations", "emulators"]
keywords = ["rom", "cartridge", "header", "emulation", "retro"]
readme = "README.md"

[dependencies]
n64dd-disk.workspace = true
one-saves-registry.workspace = true
# A `.p8.png` keeps its PICO-8 cart in the low bits of its pixels.
png = { workspace = true, optional = true }

[features]
default = ["pico8"]
# PICO-8 carts: the `cartdata()` ids a cart keeps its saves under (`rom_id::pico8`), read out of a
# `.p8` and a P8 core's `.p8c`. Nothing from outside the workspace.
pico8 = []
# A PICO-8 cart in a picture, `.p8.png`, as well. Off by default: it is the one thing here that
# pulls a decoder of its own, and a caller that never reads a picture pays nothing. Off, such a
# cart is named and refused rather than read.
pico8-png = ["pico8", "dep:png"]

[lints]
workspace = true
