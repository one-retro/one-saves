[package]
name = "one-saves"
description = "The Universal Saves Format (.1saves / 1SAV): a deterministic CBOR container for retro console save files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"

[dependencies]
dcbor.workspace = true
sha2.workspace = true
zstd = { workspace = true, optional = true }

[features]
default = ["zstd"]
# Reading and writing parts whose payload carries `encoding: "zstd"`. Without it, such a part
# decodes and round-trips fine but its payload cannot be inflated, so a content hash cannot be
# computed for a bundle that has one.
zstd = ["dep:zstd"]
# `Arc` instead of `Rc` for `dcbor`'s reference counting, which is what makes every type here
# `Send` and `Sync` — a `Bundle` held across an `.await` in a future that has to be `Send` needs
# it. Off, the whole crate is single-threaded and the refcounts are non-atomic. It is a feature
# rather than the default because the atomic traffic is real and most callers never leave a
# thread. Note that Cargo unifies features: something else in the graph turning
# `dcbor/multithreaded` on turns it on here too.
multithread = ["dcbor/multithreaded"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
