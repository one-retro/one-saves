[package]
name = "one-saves-convert"
description = "Convert emulator saves and memory cards to and from the Universal Saves Format (.1saves)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"
# The integration tests read saves from the workspace's `data/saves`, which is not part of
# this crate. They stay behind rather than shipping a copy of every fixture.
exclude = ["tests"]

[dependencies]
one-saves.workspace = true
one-saves-registry.workspace = true
dreamcast-vmu = { workspace = true, optional = true }
gc-memcard = { workspace = true, optional = true }
n64-cpak = { workspace = true, optional = true }
neogeo-memcard = { workspace = true, optional = true }
ps1-memcard = { workspace = true, optional = true }
ps2-memcard = { workspace = true, optional = true }
png = { workspace = true, optional = true }
encoding_rs = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
datary = { workspace = true, optional = true }

[features]
default = ["cards", "dat", "dat-cmpro", "rom", "shift-jis", "zstd"]
# Every card format. Each is a crate of its own and an adapter here; none of them brings anything
# from outside the workspace, so what a format costs is its own code and nothing else.
cards = ["gc", "n64", "neogeo", "ps1", "ps2", "vmu"]
gc = ["dep:gc-memcard"]
n64 = ["dep:n64-cpak"]
neogeo = ["dep:neogeo-memcard"]
ps1 = ["dep:ps1-memcard"]
ps2 = ["dep:ps2-memcard"]
vmu = ["dep:dreamcast-vmu"]
# Reading DAT catalogs, which is where this crate's weight is: `datary` brings an XML reader, a
# derive macro and the proc-macro chain under it. A converter that is handed a game's identity, or
# does not want one, does not need any of that.
dat = ["dep:datary"]
# The ClrMamePro syntax on top of the Logiqx XML one, and the `winnow` parser it is written with.
# Off, a `.dat` in that syntax is refused rather than misread.
dat-cmpro = ["dat", "datary/cmpro"]
# Reading a ROM's header and computing the digests a catalog is keyed on. This is what the four
# hash crates are for; nothing else in the crate hashes anything.
rom = ["dep:crc32fast", "dep:md-5", "dep:sha1", "dep:sha2"]
# Reading a title a console stored in Shift-JIS, which is every PlayStation and PS2 one and the
# Japanese GameCube releases. Off, such a title is omitted rather than half-read: a producer that
# would be guessing writes no label at all.
shift-jis = ["dep:encoding_rs"]
# Decoding a console's icon to PNG, for `x.1sav.icon`. Off by default: it is the only thing here
# that pulls a compression library of its own, and a producer that carries no icons pays nothing.
# A card still reads and writes without it; the key is simply absent.
icon = ["dep:png"]
# Reading a card, or the loose saves off one, out of a zip archive. This is how saves are shared,
# so it is what saves a caller a round trip through a temporary directory. Reading only: an archive
# is a way a save arrived and not a format this crate writes back.
archive = ["dep:zip"]
# Forwarded to one-saves, whose `zstd` compiles a C library. Off, a part whose payload carries
# `encoding: "zstd"` still round-trips; its payload just cannot be inflated.
zstd = ["one-saves/zstd"]
# Forwarded to one-saves: `Arc` rather than `Rc` under `dcbor`, which is what makes a `Bundle` and
# everything this crate hands back `Send` and `Sync`. Needed to hold one across an `.await` in a
# future that has to be `Send`. Unlike the rest, it is off by default — the atomic refcounts cost
# something and most callers stay on one thread.
multithread = ["one-saves/multithread"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# The icon tests hash decoded pixels, so a change of PNG encoder is not a change of picture.
[dev-dependencies]
sha2 = { workspace = true }
# The archive tests build their archives rather than vendoring them, so what is in one is stated
# in the test that reads it.
zip = { workspace = true }
