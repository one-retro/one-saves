[workspace]
resolver = "3"
members = [
    "crates/one-saves",
    "crates/one-saves-registry",
    "crates/one-saves-convert",
    "crates/one-saves-cli",
    "crates/one-saves-tui",
    "crates/dreamcast-vmu",
    "crates/gc-memcard",
    "crates/n64-cpak",
    "crates/neogeo-memcard",
    "crates/ps1-memcard",
    "crates/ps2-memcard",
    "crates/saturn-backup",
    "crates/disc-id",
    "crates/rom-id",
    "xtask",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
# 1.88 is the floor `dcbor` imposes: it uses let-chains and declares no rust-version
# of its own, so ours has to state the real one.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/one-retro/one-saves"
homepage = "https://docs.1retro.com/specifications/universal-saves-format/"
authors = ["Hans Larsen <hans@larsen.online>"]
categories = ["encoding", "filesystem", "parser-implementations"]
keywords = ["1saves", "emulation", "retro", "savegame", "cbor"]

[workspace.dependencies]
# `default-features = false` on the two crates that carry optional weight, so a member decides
# what it pays for rather than inheriting it. Both re-expose what they need as their own features,
# and both keep it on by default; see each crate's README for the list.
one-saves = { version = "0.8.0", path = "crates/one-saves", default-features = false }
one-saves-registry = { version = "0.8.0", path = "crates/one-saves-registry" }
one-saves-convert = { version = "0.8.0", path = "crates/one-saves-convert", default-features = false }
# One crate per card filesystem. None of them depends on anything, in this workspace or outside it,
# so a consumer that only wants to read a card takes one and none of the container above it. They
# still share the workspace version: nothing here is released without the rest.
dreamcast-vmu = { version = "0.8.0", path = "crates/dreamcast-vmu" }
gc-memcard = { version = "0.8.0", path = "crates/gc-memcard" }
n64-cpak = { version = "0.8.0", path = "crates/n64-cpak" }
neogeo-memcard = { version = "0.8.0", path = "crates/neogeo-memcard" }
ps1-memcard = { version = "0.8.0", path = "crates/ps1-memcard" }
ps2-memcard = { version = "0.8.0", path = "crates/ps2-memcard" }
saturn-backup = { version = "0.8.0", path = "crates/saturn-backup" }
# What a game's own media says about it: a disc image's system and serial, a ROM's system, header
# and cartridge hardware. Each depends on the registry for the systems it names and on nothing else
# outside this workspace, so a caller sorting a library of dumps needs neither the format nor the
# converters.
disc-id = { version = "0.8.0", path = "crates/disc-id" }
rom-id = { version = "0.8.0", path = "crates/rom-id" }

dcbor = "0.25"
# CHD disc images, for disc-id's `chd` feature only.
chd = "0.3"
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
crc32fast = "1.4"
# 0.13.4 is the floor the RUSTSEC-2026-03xx/04xx advisories against zstd-safe 7.2 set. The
# defaults are off because each is surface this never uses on bytes it was handed: `legacy`
# decodes the pre-1.0 frame formats no producer of a payload here ever wrote, and
# `zdict_builder` trains dictionaries, which nothing does.
zstd = { version = "0.13.4", default-features = false }
# Gzip and zlib, for the producers that compress what they write: standalone Mednafen gzips a
# Saturn Backup RAM Cart, and RetroArch, mGBA and DuckStation deflate their save states. `zlib-rs`
# rather than the `rust_backend` default: both are pure Rust, and this is the one `zip` already
# asks flate2 for, so a build that reads archives carries no second inflater to read the rest.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# For `x.1sav.icon`, where a console icon is decoded to pixels so a consumer needs no decoder of
# its own, and for a save state's screenshot, which an emulator keeps as a bare framebuffer and the
# format carries as a PNG. Optional, because a converter that carries neither should not compile a
# deflate implementation to do it.
png = "0.18"
# Shift-JIS, which is what a PlayStation, a PS2 and a Japanese GameCube release write a title in.
# A title half-read is worse than one omitted, so this is a real decoder rather than a table of
# the characters a Western release happens to use.
encoding_rs = "0.8"
# Zip archives, which is how saves are shared: an archive of a card, or of the loose saves off
# one. Reading only, and `deflate-flate2-zlib-rs` is the pure-Rust decoder on the same flate2
# backend as everything else here; 9's plain `deflate` pulls in the zopfli encoder too, and
# nothing here writes an archive. 9.0 is the floor RUSTSEC-2026-0367/0368/0369/0429 set. Those are
# all in `extract`, which nothing here calls, but an audit should not have to know that.
zip = { version = "9.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
clap = { version = "4.5", features = ["derive"] }
# The open(2) flags the CLI opens a file it was not named with by, on Unix only. Already in the
# graph under dcbor, so it costs nothing to build.
libc = "0.2"
# DAT catalogs, in both the Logiqx XML and ClrMamePro syntaxes. `index` and `verify` stay off:
# one-saves-convert keeps its own digest index, keyed by `one_saves::HashValue`, and hashing is
# one-saves' job. `cmpro` is the ClrMamePro syntax and the `winnow` parser under it, which
# one-saves-convert turns on through its own `dat-cmpro` feature rather than here.
datary = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Format-preserving TOML, for the one task that edits the root manifest. `toml` would round-trip
# through a data structure and drop every comment in it, which in this file is most of the reason
# the file is readable; `toml_edit` rewrites a value and leaves the rest of the bytes alone.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
