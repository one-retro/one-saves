[workspace]
resolver = "3"
members = [
    "crates/one-saves",
    "crates/one-saves-registry",
    "crates/one-saves-convert",
    "crates/one-saves-cli",
    "crates/dreamcast-vmu",
    "crates/gc-memcard",
    "crates/n64-cpak",
    "crates/neogeo-memcard",
    "crates/ps1-memcard",
    "crates/ps2-memcard",
    "xtask",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
# 1.88 is the floor `dcbor` imposes: it uses let-chains and declares no rust-version
# of its own, so ours has to state the real one.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/one-retro/one-saves"
homepage = "https://docs.1retro.com/specifications/universal-saves-format/"
authors = ["Hans Larsen <hans@larsen.online>"]
categories = ["encoding", "filesystem", "parser-implementations"]
keywords = ["1saves", "emulation", "retro", "savegame", "cbor"]

[workspace.dependencies]
# `default-features = false` on the two crates that carry optional weight, so a member decides
# what it pays for rather than inheriting it. Both re-expose what they need as their own features,
# and both keep it on by default; see each crate's README for the list.
one-saves = { version = "0.2.1", path = "crates/one-saves", default-features = false }
one-saves-registry = { version = "0.2.1", path = "crates/one-saves-registry" }
one-saves-convert = { version = "0.2.1", path = "crates/one-saves-convert", default-features = false }
# One crate per card filesystem. None of them depends on anything, in this workspace or outside it,
# so a consumer that only wants to read a card takes one and none of the container above it. They
# still share the workspace version: nothing here is released without the rest.
dreamcast-vmu = { version = "0.2.1", path = "crates/dreamcast-vmu" }
gc-memcard = { version = "0.2.1", path = "crates/gc-memcard" }
n64-cpak = { version = "0.2.1", path = "crates/n64-cpak" }
neogeo-memcard = { version = "0.2.1", path = "crates/neogeo-memcard" }
ps1-memcard = { version = "0.2.1", path = "crates/ps1-memcard" }
ps2-memcard = { version = "0.2.1", path = "crates/ps2-memcard" }

dcbor = "0.25"
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
crc32fast = "1.4"
zstd = "0.13"
clap = { version = "4.5", features = ["derive"] }
# DAT catalogs, in both the Logiqx XML and ClrMamePro syntaxes. `index` and `verify` stay off:
# one-saves-convert keeps its own digest index, keyed by `one_saves::HashValue`, and hashing is
# one-saves' job. `cmpro` is the ClrMamePro syntax and the `winnow` parser under it, which
# one-saves-convert turns on through its own `dat-cmpro` feature rather than here.
datary = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Format-preserving TOML, for the one task that edits the root manifest. `toml` would round-trip
# through a data structure and drop every comment in it, which in this file is most of the reason
# the file is readable; `toml_edit` rewrites a value and leaves the rest of the bytes alone.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
